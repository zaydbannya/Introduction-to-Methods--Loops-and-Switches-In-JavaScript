<html>
    <head>
        <title>project</title>
    </head>
    <body>
        <h2>project</h2>
        <p id="demo"></p>
        <script>
            var fruits = ["monday", "tuesday", "wednesday", "thursday", "friday", "saturday", "sunday"];
            var text = "";
            var i;
            for (i=0; i < fruits.length; i++)  {
                text += fruits[i] + "<br>";
                document.getElementById("demo").innerHTML = text;
            }
            var day;
            switch (new Date().getDay())  {
                case 0:
                    day = "Sunday";
                    break;
                case 1:
                    day = "Monday";
                    break;
                case 2:
                    day = "Tuesday";
                    break;
                case 3:
                    day = "Wensday";
                    break;
                case 4:
                    day = "Thursday";
                    break;
                case 5:
                    day = "Friday";
                    break;
                case 6:
                    day = "Saturday";
                    break;
            }
            document.getElementById("demo").innerHTML = "Today is " + day;
        </script>
    </body>
</html>
